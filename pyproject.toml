[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-intelligence"
version = "0.1.0"
description = "An enterprise document intelligence system using hybrid search, RAG, and LLM evaluation to deliver accurate, source-grounded answers from internal knowledge bases."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pypdf>=4.2,<7",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real semantic embeddings and the optional reranker. Pulls in PyTorch (CPU build on Windows).
ml = ["sentence-transformers>=3.0,<6"]
# Test tooling. reportlab is only used to generate PDF fixtures inside tests.
dev = ["pytest>=8", "pytest-cov>=5", "reportlab>=4"]

[project.scripts]
ragintel = "ragintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
